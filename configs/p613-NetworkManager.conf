[main]
plugins=keyfile
dhcp=internal
dns=default
rc-manager=unmanaged
hostname-mode=none
# The isolated native experiment has one interactive user and no logind.
auth-polkit=false
no-auto-default=*

[keyfile]
unmanaged-devices=*,except:interface-name:wlan0

[connectivity]
enabled=false

[device-p613-wifi]
match-device=interface-name:wlan0
wifi.scan-rand-mac-address=no

[logging]
level=INFO
domains=DEFAULT
