context.properties = {
    default.clock.rate = 48000
    default.clock.allowed-rates = [ 48000 ]
}
context.objects = [
    { factory = adapter
      args = {
        factory.name = api.alsa.pcm.sink
        node.name = p613-speakers
        node.description = "Tablet Speakers"
        media.class = Audio/Sink
        api.alsa.path = "hw:0,0"
        api.alsa.use-ucm = false
        api.alsa.disable-mmap = true
        audio.format = S16LE
        audio.rate = 48000
        audio.channels = 2
        audio.position = [ FL FR ]
        session.suspend-timeout-seconds = 5
      }
    }
    { factory = adapter
      args = {
        factory.name = api.alsa.pcm.source
        node.name = p613-microphone
        node.description = "Tablet Microphone"
        media.class = Audio/Source
        api.alsa.path = "hw:0,0"
        api.alsa.use-ucm = false
        api.alsa.disable-mmap = true
        audio.format = S16LE
        audio.rate = 48000
        audio.channels = 1
        audio.position = [ MONO ]
        session.suspend-timeout-seconds = 5
      }
    }
]
